<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="%BASE_URL%favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon/icon-light.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="%BASE_URL%favicon/apple-touch-icon.png">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="IEM Tour Group Europe — independent listening, built around community."
    />

    <title>ITGE — Coming soon</title>

    <style id="coming-soon-styles">
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      #coming-soon {
        min-height: 100vh;

        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        background:
          radial-gradient(
            circle at 75% 20%,
            rgba(193, 151, 69, 0.13),
            transparent 38%
          ),
          #0d0d0d;

        color: #f4f1eb;
      }

      #coming-soon main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      }

      #coming-soon .content {
        width: 100%;
        max-width: 760px;
      }

      #coming-soon .eyebrow {
        margin: 0 0 22px;

        color: #c19745;

        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      #coming-soon h1 {
        margin: 0;

        max-width: 720px;

        font-size: clamp(44px, 7vw, 76px);
        line-height: 1.03;
        letter-spacing: -0.045em;
        font-weight: 650;
      }

      #coming-soon .intro {
        margin: 30px 0 0;

        max-width: 620px;

        color: #aaa6a0;

        font-size: 19px;
        line-height: 1.75;
      }

      #coming-soon .divider {
        width: 48px;
        height: 2px;

        margin: 38px 0;

        background: #c19745;
      }

      #coming-soon .status {
        margin: 0;

        color: #d6d1c9;

        font-size: 15px;
        line-height: 1.7;
      }

      #coming-soon .footer {
        margin-top: 70px;

        color: #74716d;

        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @media (max-width: 640px) {
        #coming-soon main {
          align-items: flex-start;
          padding-top: 18vh;
        }

        #coming-soon .intro {
          font-size: 17px;
        }

        #coming-soon .footer {
          margin-top: 50px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <div id="coming-soon">
      <main>
        <div class="content">
          <p class="eyebrow">
            IEM Tour Group Europe
          </p>

          <h1>
            Something new is taking shape.
          </h1>

          <p class="intro">
            We're building a new home for independent audio
            reviews, listening impressions and the European
            personal audio community.
          </p>

          <div class="divider"></div>

          <p class="status">
            ITGE is getting ready for its next chapter.<br>
            We'll be back soon.
          </p>

          <p class="footer">
            Independent listening · Built around community
          </p>
        </div>
      </main>
    </div>

    <script type="module">
      if (window.location.hash.startsWith("#/")) {
        document
          .getElementById("coming-soon")
          ?.remove()

        document
          .getElementById("coming-soon-styles")
          ?.remove()

        await import("/src/main.tsx")
      }
    </script>
  </body>
</html>
